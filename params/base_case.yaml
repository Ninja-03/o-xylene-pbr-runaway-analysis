  k_m:
    value: 2.0822
    unit: 1/s
    original: {value: 2.0822, unit: 1/sec, source: RE_CODE}
    status: LITERATURE
    sources: [RE_CODE]
    note: "Volumetric pseudo-first-order constant at T_m: r = k_m exp[-(E/R)(1/T - 1/T_m)] c_x (RE_CODE km)."
  T_m:
    value: 625.0
    unit: K
    status: LITERATURE
    sources: [RE_CODE]
    note: Reference temperature of k_m (RE_CODE Tm).
  E_over_R:
    value: 13636.0
    unit: K
    status: VERIFIED
    sources: [ZB2020, RE_CODE]
    note: "ZB2020 Table 3 (van Welsenaere & Froment model, a = 13636 K) and RE_CODE (E = 13636 K) agree."
  dH_rxn:
    value: -1.284e+6
    unit: J/mol
    original: {value: -1.284e+6, unit: kJ/kmol, source: RE_CODE}
    cross_check: {value: -306707.0, unit: kcal/kmol, source: ZB2020}
    status: VERIFIED
    sources: [RE_CODE, ZB2020]
    note: "Effective (lumped) heat of the single benchmark reaction; RE_CODE and ZB2020 Table 3 agree within 0.01%."
  nu_O2:
    value: 3.0
    unit: "-"
    status: LITERATURE
    sources: [RE_SLIDES]
    note: "C8H10 + 3 O2 -> C8H4O3 + 3 H2O as written in RE_SLIDES Example 6.5; atom balance checked in C2; total moles unchanged."
  # -------------------------------------------------------------- feed
  y_x0:
    value: 0.019
    unit: "-"
    status: LITERATURE
    sources: [RE_CODE]
    range: [0.0063, 0.0207]
    range_sources: [US9765046, US10710054]
    note: "RE_CODE yxfeed = 0.019. Range = 30-100 g o-xylene per Nm3 air (patents), converted in C2."
  M_wf:
    value: 0.0303866
    unit: kg/mol
    status: LITERATURE
    sources: [RE_CODE]
    note: "RE_CODE Mwf = 0.98*(0.79*28 + 0.21*32) + 0.02*106.17 kg/kmol (re-derived in C2)."
  y_O2_0:
    value: 0.2058
    unit: "-"
    status: LITERATURE
    sources: [RE_CODE]
    note: "Implied by the RE_CODE feed (0.98 x 0.21); lumped into k_m at P_ref; used for the P-scaling and O2 checks."
  P_ref:
    value: 101000.0
    unit: Pa
    original: {value: 101.0, unit: kN/m^2, source: RE_CODE}
    status: LITERATURE
    sources: [RE_CODE, ZB2020]
    range_sources: [EEA]
    note: "RE_CODE Pf; reference pressure of k_m; outlet pressure in the pressure-drop extension (ambient discharge)."
  # -------------------------------------------------------------- operating conditions
  T0:
    value: 625.0
    unit: K
    status: VERIFIED
    sources: [ZB2020, RE_CODE]
    range: [600.0, 680.0]
    range_sources: [EEA, US5225574, US4397768]
    note: "Base feed temperature of both reproductions; range spans the documented 320-400 C operating window."
  Tc:
    value: 625.0
    unit: K
    status: VERIFIED
    sources: [ZB2020, RE_CODE]
    range: [618.0, 658.0]
    range_sources: [US9765046, US4397768]
    note: "Salt temperature Ta = 625 K (RE_CODE) = TC (ZB2020 constant-cooling case); range = documented salt baths 345-385 C (M8)."
  Qrho:
    value: 0.0026371
    unit: kg/s
    status: LITERATURE
    sources: [RE_CODE]
    note: "Mass flow per tube (RE_CODE); mass flux 5.37 kg/(m2 s)."
  # -------------------------------------------------------------- geometry
  R_tube:
    value: 0.0125
    unit: m
    original: {value: 0.0125, unit: m, source: RE_CODE}
    cross_check: {value: 0.0125, unit: m, source: "ZB2020 Dt/2"}
    status: VERIFIED
    sources: [RE_CODE, ZB2020]
    range_sources: [US9765046, US10710054]
    note: "RE_CODE R_tube = 1.25e-2 m; ZB2020 Dt = 0.025 m; industrial tubes are 25 mm (patents)."
  L:
    value: 1.5
    unit: m
    status: LITERATURE
    sources: [RE_CODE]
    note: "RE_CODE l = 1.5 m (ZB2020: 2 m; industrial 3-4 m); kept for integrity with k_m, U and Qrho."
  # -------------------------------------------------------------- thermal
  cp:
    value: 992.0
    unit: J/(kg K)
    original: {value: 0.992, unit: kJ/(kg K), source: RE_CODE}
    status: LITERATURE
    sources: [RE_CODE]
    range: [992.0, 1045.9]
    range_sources: [RE_CODE, ZB2020]
    note: "RE_CODE Cp; ZB2020 uses 0.2498 kcal/(kg K) = 1045.9 J/(kg K); both documented values spanned in M8."
  U:
    value: 373.0
    unit: W/(m^2 K)
    original: {value: 0.373, unit: kJ/(m^2 s K), source: RE_CODE}
    status: LITERATURE
    sources: [RE_CODE]
    range: [0.0, 750.0]
    note: "RE_CODE U. Study range PROJECT-DEFINED: 0 (adiabatic limit) to ~2x base; values above 373 are hypothetical cooling capacity."
  # -------------------------------------------------------------- pressure-drop extension (M3)
  Pi_max:
    value: 0.70
    unit: "-"
    status: PROJECT-DEFINED
    sources: [US4397768, US7557223]
    note: >-
      Upper end of the Ergun-number study range [0, Pi_max] with the outlet at P_ref. Chosen to
      reproduce the documented industrial pressures: Pi = 0.21 gives the ~2 m water-gauge bed
      pressure drop (US4397768), Pi = 0.41-0.70 the 0.35-0.55 bar gauge reactor-entrance pressure
      (US7557223). Pi = 0 is the benchmark (no pressure drop).
  Pi_inlet_max:
    value: 0.30
    unit: "-"
    status: PROJECT-DEFINED
    sources: []
    note: >-
      Inlet-specified comparison (P(0) = P_ref) only for Pi <= 0.30, where isothermal P_out/P0 >= 0.63
      and pressure stays well above zero under hot-spot heating; the 1-atm-inlet case is hydraulically
      infeasible at the top of the documented range.
  P_min_frac:
    value: 0.05
    unit: "-"
    status: PROJECT-DEFINED
    sources: []
    note: >-
      Numerical guard: any integration reaching P < 0.05 P_ref is stopped and discarded as invalid;
      it is never interpreted as thermal runaway.
  # -------------------------------------------------------------- constants
  R_gas:
    value: 8.314462618
    unit: J/(mol K)
    status: PROPERTY
    sources: [CODATA]
    note: "RE_CODE uses 8.314; the 0.005% difference is within the V9 tolerance."
  M_oX:
    value: 0.10617
    unit: kg/mol
    status: PROPERTY
    sources: [CODATA, RE_CODE]
    note: o-xylene C8H10 (RE_CODE uses 106.17).
  Vm_normal:
    value: 0.022414
    unit: m^3/mol
    status: PROPERTY
    sources: [CODATA]
    note: Ideal-gas molar volume at 273.15 K and 101.325 kPa; used only to convert g/Nm3 loadings.

