criteria:
  hot_spot:
    definition: "T_hs = max over 0 <= z <= L of T(z); z_hs its location; dT_hs = T_hs - Tc"
    sources: [RE_SLIDES]
  runaway_boundary:
    definition: >-
      S(z) = dT(z)/dT0 with Tc held fixed, from forward sensitivity equations, S(0) = 1.
      Critical when the interior maximum of S over 0 < z <= L equals 1 (a unique interior point with
      S = 1). max S < 1: inlet perturbations attenuated (safe side); max S > 1: amplified (runaway side).
      If dS/dz(0) > 0 the case is on the runaway side (project clarification of the edge case).
    sources: [ZB2020]
    note: sensitivity-based (parametric-sensitivity) runaway boundary - NOT a dynamic stability criterion
  Ucrit:
    definition: >-
      For fixed T0 and coolant configuration, U_crit = the U at which the runaway_boundary condition
      holds; U > U_crit lies on the safe side. Found by bracketed root finding on max S - 1.
    sources: [ZB2020]
  light_off:
    definition: "Adiabatic runs only (U = 0): z_50 where X = 0.5, and X(L). Descriptive, not a criterion."
    sources: []
  engineering_T_limit:
    definition: >-
      none - no catalyst or material temperature limit was found in the accessed sources; ~440 C
      (MO2012) is an observed operating hot spot, recorded as context only
    sources: [MO2012, US7557223]
  dynamic_stability:
    definition: >-
      not analysed. The steady initial-value model has a unique solution for given inputs; the
      outlet-pressure (two-point) case is checked numerically for uniqueness (V13).
    sources: [RE_SLIDES, ZB2020]
  morbidelli_varma:
    definition: not used - primary source (Morbidelli & Varma 1988) not accessed; optional cross-check if supplied
    sources: []

model:
  reaction: "C8H10 + 3 O2 -> C8H4O3 + 3 H2O (single lumped reaction, effective dH)"
  kinetic_law: >-
    r = k_m exp[-(E/R)(1/T - 1/T_m)] (P/P_ref) c_x,  c_x = y_x P/(R T),  y_x = y_x0 (1 - X)   [mol/(m3 s)]
  kinetic_law_note: >-
    Identical to RE_CODE at P = P_ref. P/P_ref is the first-order O2 partial-pressure dependence
    (p_O2 = y_O2 P, y_O2 held at its inlet value) of the partial-pressure law k p_O2 p_x documented in
    ZB2020 (k1 contains P_O2) and CV2024 (r = k p_j p_O2). One law for every module.
  rate_basis: per unit bed volume (catalyst lumped into k_m); no catalyst-mass coordinate
  coordinate: axial position z (m); dimensionless zeta = z/L
  oxygen_depletion: false
  pressure_drop:
    baseline: false
    M3: true
    form: "Ergun, inertia-dominated: dp/dzeta = -Pi (T/Tc)/p, p = P/P_ref"
    spec_primary: outlet
    comparisons: ["constant P = P0 (same inlet pressure, no decline)", "inlet P(0) = P_ref for Pi <= Pi_inlet_max"]
  coolant_configurations:
    physical: "Tc fixed at 625 K (RE_CODE Ta; ZB2020 TC; inside documented 618-658 K salt range); T0 varied"
    normalized: "Tc = T0 (classical convention); comparison only, not claimed industrially representative"

numerics:
  # PHASE 3 REVISION (numerics only; physical parameters unchanged). Evidence: verification V5/V6/V7/V9
  # showed global-error amplification of ~900 x rtol near runaway (rtol 1e-8 -> 9e-6 relative at
  # T0 = 630 K), violating the Phase 2 requirement of 1e-6 relative accuracy; rtol 1e-10 gives 1.7e-7.
  # Previous values: solver_primary Radau, solver_crosscheck [BDF, LSODA], rtol 1e-8, atol_scaled 1e-10.
  # BDF made primary per the Phase 3 instruction (Radau and LSODA remain independent cross-checks).
  solver_primary: BDF
  solver_crosscheck: [Radau, LSODA]
  rtol: 1.0e-10
  atol_scaled: 1.0e-12
  sensitivity_method: forward_sensitivity_equations
  fd_check_rel_step: 1.0e-5
  root_tolerance_U: 0.01
  boundary_resolution_T0: 0.05
