# =====================================================================================
#  PBR runaway project - parameter basis v0.2 (Phase 2 final gate). SI units.
#  Single source of truth. Allowed statuses ONLY: VERIFIED | LITERATURE | PROPERTY |
#  PROJECT-DEFINED. No recalled values: every v0.1 value that could not be sourced
#  (lnA 19.837 in atm units, rho_B, d_p, eps_B, L = 3 m, d_t = 25.4 mm, U = 82.7 kcal,
#  c_p = 0.237 kcal, N_tubes, T_limit, X_target) has been REMOVED.
# =====================================================================================
meta:
  project: >-
    Parametric sensitivity and runaway boundaries of a wall-cooled, non-isothermal
    packed-bed reactor with Ergun pressure drop
  base_system: >-
    o-xylene -> phthalic anhydride, single lumped pseudo-first-order reaction, 1-D
    pseudo-homogeneous plug-flow tube with molten-salt cooling. Dataset = Rawlings &
    Ekerdt Example 6.5 exactly as implemented in the authors' published code (adapted
    from van Welsenaere & Froment 1970), cross-checked against the peer-reviewed
    reproduction ZB2020.
  version: "0.2 - Phase 2 final gate"
  date: "2026-09-21"
  status_legend:
    VERIFIED: >-
      confirmed in an accessed peer-reviewed full-text reproduction of the benchmark
      (or the primary source) AND identical in the adopted dataset
    LITERATURE: taken from a fully documented, accessed source (full text or published code), cited exactly
    PROPERTY: physical constant, unit definition or standard composition
    PROJECT-DEFINED: modelling choice for this project with an explicit engineering rationale
  critical: [k_m, T_m, E_over_R, dH_rxn, nu_O2, y_x0, M_wf, y_O2_0, P_ref, T0, Tc, Qrho, R_tube, L, cp, U]

references:
  RE_CODE:
    kind: code
    accessed: code
    text: >-
      Rawlings, J.B. & Ekerdt, J.G., Chemical Reactor Analysis and Design Fundamentals,
      2nd ed., Nob Hill Publishing. Companion code main.py for Figs 6.35-6.36 (converted
      from xyleneT.m), https://sites.engineering.ucsb.edu/~jbraw/chemreacfun/fig-html/ch6/fig-6-35.html
  RE_SLIDES:
    kind: textbook
    accessed: full_text
    text: >-
      Rawlings & Ekerdt, Chapter 6 lecture slides (Nob Hill, 2026), Example 6.5, Table 6.5,
      slides 115-121, https://sites.engineering.ucsb.edu/~jbraw/chemreacfun/ch6/slides-enbal.pdf.
      Table 6.5 prints km = 1922.6 s^-1 and dH_R = -1.361e3 kJ/kmol, contradicting the code
      that generated the published figures; not used.
  ZB2020:
    kind: peer_reviewed
    accessed: full_text
    text: >-
      Zuluaga-Botero, S., Dobrosz-Gomez, I. & Gomez-Garcia, M.-A. (2020) Parametric sensitivity
      analysis for the industrial case of o-xylene oxidation to phthalic anhydride in a packed
      bed catalytic reactor. Catalysts 10(6), 626. doi:10.3390/catal10060626 (Tables 2-4,
      Eqs 1-21, Sections 5-6)
  CV2024:
    kind: peer_reviewed
    accessed: partial
    text: >-
      Carrasco-Venegas, L.A. et al. (2024) ChemEngineering 8(2), 35,
      doi:10.3390/chemengineering8020035 (model equations 1-20 read; data table not retrieved)
  VWF1970:
    kind: primary
    accessed: "no"
    text: >-
      van Welsenaere, R.J. & Froment, G.F. (1970) Parametric sensitivity and runaway in fixed
      bed catalytic reactors. Chem. Eng. Sci. 25, 1503-1516 (original benchmark, not accessed;
      optional cross-check only)
  EEA:
    kind: guidebook
    accessed: excerpt
    text: >-
      EMEP/CORINAIR Emission Inventory Guidebook, activity 040519 (Phthalic anhydride):
      multitubular reactor operated at 380-400 C and ambient pressure
  US4397768:
    kind: patent
    accessed: excerpt
    text: >-
      US 4,397,768 A: ~3 m x 25 mm tubes; 4 Nm3/h air per tube gives a pressure drop of about
      2 m water gauge over a 2.8 m ring-catalyst bed; salt bath usually 375-385 C
  US7557223:
    kind: patent
    accessed: excerpt
    text: "US 7,557,223 (claim): gauge pressure at the reactor entrance 0.35-0.55 bar; hot spots may damage the catalyst"
  US4119645:
    kind: patent
    accessed: excerpt
    text: "US 4,119,645 A: long tubes give considerable pressure drop, requiring compression of the feed air"
  US9765046:
    kind: patent
    accessed: excerpt
    text: "US 9,765,046: 25 mm x 4.0 m tube; 30-100 g o-xylene/Nm3 air; salt bath 345 C"
  US10710054:
    kind: patent
    accessed: excerpt
    text: "US 10,710,054: 25 mm x 350 cm tube; 30-100 g o-xylene/Nm3 air"
  US5225574:
    kind: patent
    accessed: excerpt
